spring.application.name=OrderService

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/project2_m2
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Product API Configuration
product.api.url=http://localhost:8081/api/products

# Payment Service Configuration
payment.api.url=http://localhost:8082/api/payments
# Set to true to enable external payment service, false to use local payment processing
payment.service.enabled=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.order=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==================== RESILIENCE4J CONFIGURATION ====================

# Circuit Breaker - Product Service
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.register-health-indicator=true

# Circuit Breaker - Payment Service
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.failure-rate-threshold=70
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.register-health-indicator=true

# Retry - Product Service
resilience4j.retry.instances.productServiceRetry.max-attempts=3
resilience4j.retry.instances.productServiceRetry.wait-duration=500ms
resilience4j.retry.instances.productServiceRetry.retry-exceptions=java.util.concurrent.TimeoutException,java.net.ConnectException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.productServiceRetry.ignore-exceptions=java.io.FileNotFoundException

# Retry - Payment Service
resilience4j.retry.instances.paymentServiceRetry.max-attempts=2
resilience4j.retry.instances.paymentServiceRetry.wait-duration=1000ms
resilience4j.retry.instances.paymentServiceRetry.retry-exceptions=java.util.concurrent.TimeoutException,java.net.ConnectException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.paymentServiceRetry.ignore-exceptions=org.springframework.web.client.HttpClientErrorException.BadRequest

# Time Limiter - Product Service
resilience4j.timelimiter.instances.productServiceTimeLimiter.timeout-duration=5s
resilience4j.timelimiter.instances.productServiceTimeLimiter.cancel-running-future=true

# Time Limiter - Payment Service
resilience4j.timelimiter.instances.paymentServiceTimeLimiter.timeout-duration=10s
resilience4j.timelimiter.instances.paymentServiceTimeLimiter.cancel-running-future=true

# Resilience4j Management Endpoints
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,retries
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

